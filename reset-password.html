<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Restablece tu contraseña de Puente.">
  <title>Restablecer contraseña — Puente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌉</text></svg>">

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>

<body class="auth-page">

  <div class="auth-card">
    <a href="index.html" class="auth-logo">Puente</a>

    <h1>¿Olvidaste tu contraseña?</h1>
    <p class="auth-subtitle">Ingresa tu correo y te enviaremos un enlace para crear una nueva.</p>

    <div class="auth-error" id="reset-error" role="alert"></div>
    <div class="form-feedback" id="reset-success" role="status"></div>

    <form id="reset-form" novalidate>
      <div class="form-group">
        <label for="reset-email">Correo electrónico</label>
        <input type="email" id="reset-email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar enlace</button>
    </form>

    <p class="auth-switch">
      ¿La recordaste? <a href="login.html">Iniciar sesión</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/reset-password.js"></script>
</body>

</html>
