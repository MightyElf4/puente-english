<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crea una nueva contraseña para tu cuenta de Puente.">
  <title>Nueva contraseña — Puente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌉</text></svg>">

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>

<body class="auth-page">

  <div class="auth-card">
    <a href="index.html" class="auth-logo">Puente</a>

    <h1>Crea una nueva contraseña</h1>
    <p class="auth-subtitle">Elige una contraseña de al menos 8 caracteres.</p>

    <div class="auth-error" id="update-error" role="alert"></div>

    <form id="update-form" novalidate>
      <div class="form-group">
        <label for="new-password">Nueva contraseña</label>
        <input type="password" id="new-password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirmar contraseña</label>
        <input type="password" id="confirm-password" placeholder="Repite la contraseña" autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Guardar contraseña</button>
    </form>

    <p class="auth-switch">
      <a href="login.html">Volver a iniciar sesión</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/update-password.js"></script>
</body>

</html>
